name: AI Daily Report

on:
  schedule:
    # 06:30 UTC = 08:30 Paris (CEST)
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code (main branch)
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Checkout persistent database branch
      - name: Checkout portfolio database
        uses: actions/checkout@v4
        with:
          ref: portfolio-data
          path: db
          fetch-depth: 1

      # 3. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Ensure database folder exists
      - name: Prepare database
        run: mkdir -p db/data

      # 6. Run AI pipeline
      - name: Run Daily Pipeline
        run: python main.py
        env:
          PORTFOLIO_DB: db/data/portfolio.db

          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # 7. Commit updated SQLite database
      - name: Commit portfolio database
        working-directory: db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/portfolio.db

          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Daily portfolio update $(date -u +'%Y-%m-%d')"
            git push origin portfolio-data
          fi