name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python 3.12 • Ruff • Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          TG_FORUM_TOPICS_ID: ${{ secrets.TG_FORUM_TOPICS_ID }}
          TG_TOPIC_LOGS_ID: ${{ secrets.TG_TOPIC_LOGS_ID }}
          TG_TOPIC_DAILY_ID: ${{ secrets.TG_TOPIC_DAILY_ID }}
          TG_TOPIC_MARKET_CLOSE_ID: ${{ secrets.TG_TOPIC_MARKET_CLOSE_ID }}

          ENABLE_TELEGRAM_LOG: ${{ secrets.ENABLE_TELEGRAM_LOG }}

          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml