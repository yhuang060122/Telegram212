[project]
name = "telegram212-api"
version = "0.1.0"
description = "Cloudflare Python Worker adapter for the Trading212 AI Analyst API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "supabase>=2.6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.uv]
package = false